name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # нужно только для публикации Release по тегу

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Шрифт Inter (лицензия OFL) скачивается при сборке, в репозитории его хранить не нужно.
      # Если скачать не вышло, сборка не падает: лаунчер просто возьмёт системный шрифт.
      - name: Fetch Inter font (best effort)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          F=app/src/main/assets/fonts
          mkdir -p "$F" /tmp/inter /tmp/f
          gh release download -R rsms/inter -p 'Inter-*.zip' -D /tmp/inter
          Z=$(ls /tmp/inter/Inter-*.zip 2>/dev/null | head -1)
          if [ -n "$Z" ]; then
            unzip -q -j -o "$Z" "*Inter-Regular.otf" "*Inter-SemiBold.otf" "*Inter-Regular.ttf" "*Inter-SemiBold.ttf" "*InterVariable.ttf" "*LICENSE.txt" -d /tmp/f
            pick() {
              for ext in otf ttf; do
                if [ -f "/tmp/f/$1.$ext" ]; then cp "/tmp/f/$1.$ext" "$F/$2.$ext"; return; fi
              done
            }
            pick Inter-Regular regular
            pick Inter-SemiBold semibold
            if ! ls "$F"/regular.* >/dev/null 2>&1 && [ -f /tmp/f/InterVariable.ttf ]; then
              cp /tmp/f/InterVariable.ttf "$F/regular.ttf"
            fi
            [ -f /tmp/f/LICENSE.txt ] && cp /tmp/f/LICENSE.txt "$F/LICENSE-Inter.txt"
          fi
          ls -la "$F"
          exit 0

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Print signing certificate
        continue-on-error: true
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lite-launcher-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
